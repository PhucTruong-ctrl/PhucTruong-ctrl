name: Latest Blog Posts

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull in blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Add your blog RSS feed URL here
          # Examples:
          # - Dev.to: https://dev.to/feed/YOUR_USERNAME
          # - Medium: https://medium.com/feed/@YOUR_USERNAME
          # - Hashnode: https://YOUR_BLOG.hashnode.dev/rss.xml
          # - Personal blog: https://yourblog.com/rss.xml
          feed_list: "https://dev.to/feed/phuctruong"
          max_post_count: 5
          template: "- [$title]($url) - $date"
          date_format: "mmm dd, yyyy"
          comment_tag_name: "BLOG-POST-LIST"
